<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dockside Changelog</title>
    <style>
        :root {
            --bg: #f4f4f6;
            --surface: #ffffff;
            --text: #1d1d1f;
            --muted: #86868b;
            --border: #ececef;
            --accent: #0a84ff;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 1px rgba(0, 0, 0, 0.04);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --surface: #2a2a2c;
                --text: #f2f2f2;
                --muted: #98989d;
                --border: #38383a;
                --accent: #4c9eff;
                --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
            }
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            margin: 0;
            padding: 14px;
            color: var(--text);
            background-color: var(--bg);
            -webkit-font-smoothing: antialiased;
        }
        .header {
            margin: 0 0 14px 0;
        }
        .title-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        h1 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.01em;
        }
        .version {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            background: var(--border);
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.01em;
        }
        .subtext {
            font-size: 11px;
            color: var(--muted);
            margin: 4px 0 0 0;
        }
        .subtext a {
            color: var(--accent);
            text-decoration: none;
        }
        .subtext a:hover { text-decoration: underline; }
        .subtext .sep {
            margin: 0 6px;
            opacity: 0.5;
        }
        .section {
            background: var(--surface);
            border-radius: 10px;
            padding: 4px 14px;
            margin: 0 0 10px 0;
            box-shadow: var(--shadow);
        }
        h2 {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin: 12px 0 4px 0;
        }
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        li {
            position: relative;
            padding: 7px 0 7px 18px;
            border-bottom: 1px solid var(--border);
        }
        li:last-child { border-bottom: none; }
        li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: 13px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
        }
        .footer {
            margin: 14px 0 2px 0;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 11px;
            color: var(--muted);
        }
        .footer .heart { color: #ff453a; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title-row">
            <h1>Dockside Changelog</h1>
            <span class="version">v2.9.28</span>
        </div>
        <p class="subtext">
            Join our <a href="https://discord.gg/dockside">Discord</a>/<a href="https://www.reddit.com/r/dockside/">Reddit</a> Community
            <span class="sep">|</span>
            Bugs: <a href="mailto:hachipoo.apps@gmail.com">hachipoo.apps@gmail.com</a>
        </p>
    </div>
    <div class="section">
        <h2>What's New</h2>
        <ul><li>General improvements &amp; bug fixes</li></ul>
    </div>
    <div class="footer">
        Crafted with <span class="heart">&#10084;</span> by an indie developer
    </div>
</body>
</html>
